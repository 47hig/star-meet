<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarMeet 星遇 - 社交K歌直播</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif;}
        body {background:#fef7ff;color:#333;}
        nav {display:flex;justify-content:space-between;align-items:center;padding:20px 24px;max-width:1100px;margin:0 auto;}
        .logo {font-size:22px;font-weight:bold;color:#9955cc;}
        .nav-link a {margin-left:24px;color:#555;text-decoration:none;}
        .hero {text-align:center;padding:70px 20px;}
        .hero h1 {font-size:40px;color:#8844bb;margin-bottom:16px;}
        .hero p {font-size:18px;color:#666;max-width:600px;margin:0 auto 32px;}
        .btn {display:inline-block;background:#b886eb;color:white;padding:14px 32px;border-radius:999px;text-decoration:none;font-weight:500;}
        .container {max-width:1100px;margin:0 auto;padding:40px 24px;}
        .section-title {text-align:center;font-size:26px;color:#8844bb;margin-bottom:36px;}
        .grid {display:grid;grid-template-columns:repeat(auto-fit, minmax(240px,1fr));gap:24px;}
        .card {background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,0.08);}
        .card h3 {color:#9955cc;margin-bottom:10px;}
        footer {text-align:center;padding:40px 20px;color:#888;font-size:14px;margin-top:30px;}
    </style>
</head>
<body>
    <nav>
        <div class="logo">StarMeet 星遇</div>
        <div class="nav-link">
            <a href="#feature">功能</a>
            <a href="#about">关于</a>
        </div>
    </nav>

    <div class="hero">
        <h1>星遇 · 遇见同好</h1>
        <p>集K歌、直播、短视频、交友于一体的娱乐社交原型项目</p>
        <a class="btn" href="#feature">查看功能</a>
    </div>

    <div class="container" id="feature">
        <h2 class="section-title">核心功能</h2>
        <div class="grid">
            <div class="card">
                <h3>在线K歌房</h3>
                <p>多人一起点歌唱歌，轻松互动。</p>
            </div>
            <div class="card">
                <h3>实时直播</h3>
                <p>开播分享，和好友实时聊天。</p>
            </div>
            <div class="card">
                <h3>短视频浏览</h3>
                <p>刷精彩片段，发现有趣内容。</p>
            </div>
            <div class="card">
                <h3>交友互动</h3>
                <p>认识新朋友，一起娱乐。</p>
            </div>
        </div>
    </div>

    <div class="container" id="about">
        <div class="card">
            <h3>项目说明</h3>
            <p>StarMeet 星遇仅为技术学习演示原型，不对外商用，部署于 GitHub Pages。</p>
        </div>
    </div>

    <footer>
        StarMeet © 2026 | Demo Project For Learning
    </footer>
</body>
</html>
